version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    open-pull-requests-limit: 5
    groups:
      backend-patches:
        patterns:
          - "*"
        update-types:
          - "patch"
      backend-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "actions"
    open-pull-requests-limit: 5
    groups:
      actions-patches:
        patterns:
          - "*"
        update-types:
          - "patch"
      actions-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "major"
