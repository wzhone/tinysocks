name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: "1.96"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy, rustfmt

      - name: Install cargo-audit
        uses: taiki-e/install-action@9db2e3e17e998ef5ab5a82b04af9122124e2dc4f # cargo-audit

      - name: Audit dependencies
        run: cargo audit

      - name: cargo fmt
        run: cargo +${{ env.RUST_VERSION }} fmt --all -- --check

      - name: cargo clippy
        run: cargo +${{ env.RUST_VERSION }} clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo +${{ env.RUST_VERSION }} test --all --locked

      - name: cargo build
        run: cargo +${{ env.RUST_VERSION }} build --locked

      - name: curl e2e tests
        run: .github/scripts/e2e-curl.sh
